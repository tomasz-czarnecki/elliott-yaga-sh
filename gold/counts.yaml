# His hand-labelled counts: a regression test that the engine can at least reproduce his reading, not ground truth (master
# plan, gold/). `ewave-counts gold` prints pass or fail per entry with its rank and axis scores; tests/test_gold.py runs them.
#
# To add one, copy an entry: one entry per count. Each label lists its acceptable pivots, a list when he allows more than
# one. Times are UTC, prices as the bars print them. A pivot matches within the entry's `tol_bars` bars of its frame and
# `tol_price` (a share of price).
#   checks:
#     enumerate   the engine finds this labelling among the legal readings of that frame
#     rank_first  unconstrained, it ranks first among the readings of that frame that start at its 0 and reach its last label
#     in_tree     in the premise tree, kept children show it wherever the parent reading has room for it
#     kept        run without the premise, the root keeps a reading of this pattern between its 0 and its last label
#     inside      each wave of each variant against the inside rule: what it must hold, what was found, and where (rules/counts.yaml: inside)
#   as_of: the data is cut here, so that later bars cannot move the regression. `ewave-counts gold --latest` runs on today's bars.
