[project]
name = "ewave"
version = "0.1.0"
description = "Elliott Wave analyzer for BTC: Phase 0 data collector"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=2.0,<2.1",
    "httpx==0.28.1",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.100",
]

[project.scripts]
ewave-data = "ewave.ingest.cli:main"
ewave-cycles = "ewave.cycles.cli:main"
ewave-counts = "ewave.counts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ewave"]

[tool.uv]
# Only use releases that are at least 14 days old (Polars 2.1 / DuckDB 2.0 are brand new).
exclude-newer = "2026-10-12T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real exchange APIs (deselected by default; run with -m network)"]
addopts = "-m 'not network'"
