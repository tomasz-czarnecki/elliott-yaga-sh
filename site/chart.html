<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC candlesticks · elliott.yaga.sh</title>
  <meta name="description" content="BTC candlesticks from Bybit, Binance and Bitstamp, built from the project's own verified minute data.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0C1526">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elliott.yaga.sh/chart.html">
  <meta property="og:title" content="BTC candlesticks · elliott.yaga.sh">
  <meta property="og:description" content="BTC candlesticks from Bybit, Binance and Bitstamp, built from the project's own verified minute data.">
  <meta property="og:image" content="https://elliott.yaga.sh/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/lightweight-charts.standalone.production.js" defer></script>
  <script src="common.js" defer></script>
  <script src="chart.js" defer></script>
  <script src="cycles.js" defer></script>
  <script src="counts.js" defer></script>
</head>
<body class="chart-page">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">
        <a href="index.html" class="brand">
          <img class="brand-mark" src="assets/elliott-mark.svg" width="36" height="36" alt="">
          <span class="brand-name">elliott.yaga.sh</span>
        </a>
      </div>
      <a href="index.html" class="btn btn-ghost btn-sm">About</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="seg-venue" role="group" aria-label="Venue"></div>
    <div class="seg" id="seg-tf" role="group" aria-label="Timeframe"></div>
    <div class="seg" id="seg-scale" role="group" aria-label="Price scale"></div>
    <div class="seg" id="seg-cycles" role="group" aria-label="Cycles overlay" hidden></div>
    <div class="seg" id="seg-counts" role="group" aria-label="Counts panel" hidden></div>
  </div>
  <div class="cycles-bar" id="cycles-bar" hidden>
    <div class="seg" id="seg-cycle-levels" role="group" aria-label="Cycle levels"></div>
    <div class="seg" id="seg-cycle-layers" role="group" aria-label="Cycle layers"></div>
    <div class="cycles-info" id="cycles-info" aria-live="off"></div>
  </div>

  <div class="readout" id="readout" aria-live="off"></div>

  <main class="chart-wrap" id="chart-wrap">
    <div id="chart"></div>
    <div class="chart-msg" id="chart-msg">Loading</div>
    <aside class="counts-panel" id="counts-panel" aria-label="Wave counts" hidden></aside>
  </main>

  <footer class="chart-foot">
    <span id="foot-until"></span>
    <span id="foot-venue"></span>
  </footer>
</body>
</html>
