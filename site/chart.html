<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC candlesticks · elliott.yaga.sh</title>
  <meta name="description" content="BTC candlesticks from Bybit, Binance and Bitstamp, built from the project's own verified minute data.">
  <link rel="icon" href="assets/yaga-mark-dark.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/lightweight-charts.standalone.production.js" defer></script>
  <script src="common.js" defer></script>
  <script src="chart.js" defer></script>
</head>
<body class="chart-page">
  <div class="yaga-bar">
    <div class="yaga-bar-inner">
      <a class="yaga-bar-link" href="https://www.yaga.sh">
        <svg class="yaga-bar-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>
        <img class="yaga-bar-mark" src="assets/yaga-mark-dark.webp" width="128" height="128" alt="">
        <span>Back to <strong>yaga.sh</strong></span>
      </a>
    </div>
  </div>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">
        <a href="index.html" class="brand">
          <img class="brand-mark" src="assets/yaga-mark-dark.webp" width="128" height="128" alt="">
          <span class="brand-name">elliott.yaga.sh</span>
        </a>
      </div>
      <a href="index.html" class="btn btn-ghost btn-sm">About</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="seg-venue" role="group" aria-label="Venue"></div>
    <div class="seg" id="seg-tf" role="group" aria-label="Timeframe"></div>
    <div class="seg" id="seg-scale" role="group" aria-label="Price scale"></div>
  </div>

  <div class="readout" id="readout" aria-live="off"></div>

  <main class="chart-wrap">
    <div id="chart"></div>
    <div class="chart-msg" id="chart-msg">Loading</div>
  </main>

  <footer class="chart-foot">
    <span id="foot-until"></span>
    <span id="foot-venue"></span>
  </footer>
</body>
</html>
